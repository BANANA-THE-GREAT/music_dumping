name: vocal-score-studio
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vocal_score
      POSTGRES_PASSWORD: vocal_score_dev
      POSTGRES_DB: vocal_score
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U vocal_score"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: vocal_score
      MINIO_ROOT_PASSWORD: vocal_score_dev_secret
    volumes: [minio-data:/data]
    ports: ["9001:9001"]
  api:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.api
    environment: &backend-env
      VSS_DATABASE_URL: postgresql+psycopg://vocal_score:vocal_score_dev@postgres/vocal_score
      VSS_BROKER_URL: redis://redis:6379/0
      VSS_RESULT_BACKEND: redis://redis:6379/1
      VSS_WORKER_BACKEND: celery
      VSS_AUTO_CREATE_SCHEMA: "false"
      VSS_DATA_DIR: /data
    volumes: [app-data:/data]
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; result = json.load(urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)); assert result['checks']['database'] == 'ok'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.worker
    environment:
      <<: *backend-env
      TORCH_HOME: /models/torch
      HF_HOME: /models/huggingface
    volumes: [app-data:/data, model-cache:/models]
    depends_on:
      api: {condition: service_healthy}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  web:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.web
    ports: ["127.0.0.1:8080:80"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      api: {condition: service_healthy}
volumes:
  postgres-data:
  redis-data:
  minio-data:
  app-data:
  model-cache:
